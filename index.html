<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erizofilm — Portada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0d0f12; --card-bg: #121418; --text-main: #e2e8f0; --text-muted: #8a94a6; --accent-primary: #6366f1; --border-color: #22262f; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .intro-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 60px 50px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .intro-title { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 12px; font-family: 'Courier Prime', monospace; letter-spacing: 1.5px; }
        .intro-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; }
        .btn-enter { background: var(--accent-primary); color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s; }
        .btn-enter:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="intro-card">
        <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-primary); margin-bottom: 15px; font-weight: 600;">Portfolio de Guiones</div>
        <div class="intro-title">ERIZOFILM</div>
        <div class="intro-sub">Plataforma de desarrollo y lectura de guiones técnicos y cinematográficos.</div>
        <a href="guiones.html" class="btn-enter">Ver Lista de Guiones</a>
    </div>
</body>
</html>
