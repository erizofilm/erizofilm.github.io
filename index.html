<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erizofilm — Spec Scripts & Producción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07080a;
            --text-cream: #f1f5f9;
            --text-muted: #64748b;
            --solid-color: #881337; /* Rojo vino oscuro / sangre profundo (Thriller Noir) */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100vh; width: 100%; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-cream);
            font-family: 'Special Elite', monospace; /* Única fuente general de máquina de escribir */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        /* ESCENA DE LA CLAQUETA */
        .slate-container {
            width: 100%;
            max-width: 500px;
            margin: 0 0 75px 0;
            position: relative;
        }

        /* BARRAS DE LA CLAQUETA EN LA PARTE SUPERIOR */
        .slate-bars-top {
            width: 100%;
            height: 108px;
            position: relative;
            margin-bottom: -2px;
            z-index: 2;
        }

        /* BARRA INFERIOR FIJA (GROSOR: 54px) */
        .bar-bottom {
            width: 100%;
            height: 54px;
            background: repeating-linear-gradient(
                -45deg,
                #0d1117,
                #0d1117 30px,
                #f1f5f9 30px,
                #f1f5f9 60px
            );
            border: 4px solid #f1f5f9;
            position: absolute;
            bottom: 0;
            left: 0;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }

        /* BARRA SUPERIOR ELEVADA (SITUADA ENCIMA, ROTACIÓN +15deg) */
        .bar-top {
            width: 100%;
            height: 54px;
            background: repeating-linear-gradient(
                -45deg,
                #0d1117,
                #0d1117 30px,
                #f1f5f9 30px,
                #f1f5f9 60px
            );
            border: 4px solid #f1f5f9;
            position: absolute;
            bottom: 54px;
            left: 0;
            transform-origin: 100% 100%;
            transform: rotate(+15deg);
            box-shadow: -6px -8px 25px rgba(0,0,0,0.9);
            border-radius: 4px;
        }

        /* CUADRADO PRINCIPAL DE LA CLAQUETA */
        .slate-box {
            background: #0d1117;
            border: 4px solid #f1f5f9;
            border-top: 1px solid #1e293b;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            padding: 28px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.95);
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .slate-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-bottom: 2px dashed #1e293b;
            padding-bottom: 14px;
            margin-bottom: 14px;
        }

        .slate-label {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-family: 'Special Elite', monospace;
        }

        /* FUENTE MANUSCRITA PURA (CAVEAT) PARA TODOS LOS DATOS */
        .slate-val-script {
            font-family: 'Caveat', cursive;
            font-size: 36px;
            color: #be123c;
            letter-spacing: 1.5px;
            line-height: 0.85;
            font-weight: 700;
        }

        .slate-val-script-white {
            font-family: 'Caveat', cursive;
            font-size: 34px;
            color: #ffffff;
            letter-spacing: 1.5px;
            line-height: 0.85;
            font-weight: 700;
        }

        /* BOTÓN CON ESTILO MANUSCRITO */
        .btn-enter-vintage {
            display: inline-block;
            background-color: var(--solid-color);
            color: #f1f5f9;
            text-decoration: none;
            padding: 16px 38px;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: 2px;
            border-radius: 6px;
            text-transform: uppercase;
            box-shadow: 0 6px 25px rgba(136, 19, 55, 0.4);
            transition: all 0.25s ease;
            text-align: center;
        }

        .btn-enter-vintage:hover {
            background-color: #9f1239;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(159, 18, 57, 0.6);
        }

        .footer-vintage {
            margin-top: 50px;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-align: center;
            font-family: 'Special Elite', monospace;
        }

        @media (max-width: 640px) {
            .slate-container { margin-bottom: 45px; }
            .slate-val-script { font-size: 30px; }
            .slate-val-script-white { font-size: 28px; }
            .btn-enter-vintage { padding: 14px 24px; font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- CLAQUETA PRINCIPAL -->
    <div class="slate-container">
        
        <div class="slate-bars-top">
            <div class="bar-bottom"></div>
            <div class="bar-top"></div>
        </div>

        <div class="slate-box">

            <!-- Productora -->
            <div class="slate-row">
                <div>
                    <div class="slate-label">PRODUCTION</div>
                    <div class="slate-val-script">ERIZOFILM</div>
                </div>
                <div>
                    <div class="slate-label">YEAR / TAKE</div>
                    <div class="slate-val-script-white">2026 / 01</div>
                </div>
            </div>

            <!-- Título del Proyecto -->
            <div style="border-bottom: 2px dashed #1e293b; padding-bottom: 14px; margin-bottom: 14px;">
                <div class="slate-label">TITLE / PROJECT</div>
                <div class="slate-val-script-white" style="font-size: 38px;">Catálogo de Guiones</div>
            </div>

            <!-- Director / Formato -->
            <div class="slate-row" style="border-bottom: none; padding-bottom: 0; margin-bottom: 0;">
                <div>
                    <div class="slate-label">DIRECTOR</div>
                    <div class="slate-val-script-white">Frodo</div>
                </div>
                <div>
                    <div class="slate-label">FORMAT</div>
                    <div class="slate-val-script-white">Spec Script</div>
                </div>
            </div>

        </div>

    </div>

    <a href="guiones.html" class="btn-enter-vintage">
        🎬 Ingresar al Catálogo
    </a>

    <div class="footer-vintage">
        © 2026 ERIZOFILM STUDIOS · PROPIEDAD INTELECTUAL REGISTRADA
    </div>

</body>
</html>
