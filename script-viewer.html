<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Guion — Erizofilm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #0d0f12; 
            --card-bg: #121418; 
            --text-main: #e2e8f0; 
            --text-muted: #8a94a6; 
            --accent-primary: #6366f1; 
            --border-color: #22262f; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        header { 
            width: 100%; 
            background: rgba(18,20,24,0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border-color); 
            padding: 12px 24px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .btn-action { 
            background: #181b22; 
            color: var(--text-main); 
            border: 1px solid var(--border-color); 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 500; 
            cursor: pointer; 
            text-decoration: none; 
            transition: all 0.2s; 
        }
        .btn-action:hover { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

        .script-wrapper { 
            width: 100%; 
            max-width: 850px; 
            margin: 40px auto 80px auto; 
            display: flex; 
            flex-direction: column; 
            gap: 40px; 
            padding: 0 20px; 
        }

        /* HOJA TAMAÑO CARTA EN PANTALLA */
        .page { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            min-height: 980px; 
            padding: 80px 90px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            position: relative; 
            font-family: 'Courier Prime', Courier, monospace; 
            font-size: 15px; 
            line-height: 1.5; 
        }

        /* NUMERACIÓN (SÓLO VISIBLE A PARTIR DEL GUIÓN) */
        .page-number { 
            position: absolute; 
            top: 35px; 
            right: 45px; 
            font-size: 13px; 
            color: var(--text-muted); 
            font-family: 'Courier Prime', monospace; 
        }

        /* PORTADA */
        .cover-page { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 820px; 
            text-align: center; 
            font-family: 'Inter', sans-serif; 
        }
        .cover-title { font-size: 30px; font-weight: 700; color: #fff; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; font-family: 'Courier Prime', monospace; }
        .cover-subtitle { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 160px; }
        .cover-author { font-size: 14px; color: var(--text-main); line-height: 1.8; }

        /* SINOPSIS Y REPARTO */
        .synopsis-page { font-family: 'Inter', sans-serif; }
        .synopsis-page h2 { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; letter-spacing: 1px; }
        .synopsis-page p, .synopsis-page li { font-size: 14px; color: var(--text-main); margin-bottom: 12px; line-height: 1.6; }

        /* FORMATO GUIÓN */
        .scene { font-weight: 700; text-transform: uppercase; margin-top: 28px; margin-bottom: 14px; color: #fff; }
        .action { margin-bottom: 16px; color: var(--text-main); line-height: 1.5; }
        .character { text-transform: uppercase; font-weight: 700; margin-top: 20px; margin-bottom: 2px; margin-left: 38%; color: #fff; }
        .parenthetical { font-style: italic; margin-left: 28%; color: var(--text-muted); margin-bottom: 2px; }
        .dialogue { margin-left: 20%; margin-right: 20%; margin-bottom: 16px; color: var(--text-main); }

        @media print {
            body { background: white; color: black; }
            header { display: none !important; }
            .script-wrapper { margin: 0; padding: 0; gap: 0; }
            .page { 
                background: white !important; 
                color: black !important; 
                border: none !important; 
                box-shadow: none !important; 
                page-break-after: always; 
                break-after: page; 
                padding: 50px 60px; 
                min-height: auto; 
            }
            .cover-title, .synopsis-page h2, .scene, .character { color: black !important; }
            .cover-subtitle, .parenthetical
