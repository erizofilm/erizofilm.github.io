<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor de Guion — Erizofilm</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020203;
            color: #e2e8f0;
            font-family: 'Courier Prime', monospace;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            background-image: radial-gradient(rgba(112, 12, 36, 0.04) 1px, transparent 0);
            background-size: 20px 20px;
        }
        .top-bar {
            width: 100%;
            max-width: 850px;
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-start;
        }
        .btn-back {
            background: transparent;
            color: #475569;
            border: 1px solid #181d24;
            padding: 8px 16px;
            border-radius: 4px;
            font-family: 'Special Elite', monospace;
            font-size: 12px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s;
        }
        .btn-back:hover {
            color: #f1f5f9;
            border-color: #475569;
            background-color: rgba(255,255,255,0.02);
        }
        .script-page {
            width: 100%;
            max-width: 850px;
            background: #07090c;
            border: 2px solid #181d24;
            padding: 70px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95);
            border-radius: 6px;
        }
        pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier Prime', monospace;
            font-size: 15px;
            line-height: 1.6;
            color: #cbd5e1;
            background: transparent;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="script-list.html" class="btn-back">← Volver a la Lista</a>
    </div>

    <div class="script-page">
        <pre id="contenidoGuion">Cargando guion original...</pre>
    </div>

    <script>
        async function cargarGuionOriginal() {
            const urlParams = new URLSearchParams(window.location.search);
            let filePath = urlParams.get('file');

            if (!filePath) {
                document.getElementById('contenidoGuion').textContent = "No se especificó ningún archivo de guion.";
                return;
            }

            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error("No se pudo cargar el archivo");
                const contenidoTexto = await res.text();
                
                // Mantiene exactamente la fuente original y el formato intacto del .txt
                document.getElementById('contenidoGuion').textContent = contenidoTexto;
            } catch (e) {
                document.getElementById('contenidoGuion').textContent = "Error al cargar el contenido del guion desde el servidor.";
            }
        }

        cargarGuionOriginal();
    </script>
</body>
</html>
