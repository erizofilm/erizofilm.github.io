<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Guion — Erizofilm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #0d0f12; 
            --card-bg: #121418; 
            --text-main: #e2e8f0; 
            --text-muted: #8a94a6; 
            --accent-primary: #6366f1; 
            --border-color: #22262f; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        header { 
            width: 100%; 
            background: rgba(18,20,24,0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border-color); 
            padding: 12px 24px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .btn-action { 
            background: #181b22; 
            color: var(--text-main); 
            border: 1px solid var(--border-color); 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 500; 
            cursor: pointer; 
            text-decoration: none; 
            transition: all 0.2s; 
        }
        .btn-action:hover { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

        .script-wrapper { 
            width: 100%; 
            max-width: 850px; 
            margin: 40px auto 80px auto; 
            display: flex; 
            flex-direction: column; 
            gap: 40px; 
            padding: 0 20px; 
        }

        /* HOJA TAMAÑO CARTA */
        .page { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            min-height: 980px; 
            padding: 70px 80px 80px 80px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            position: relative; 
            font-family: 'Courier Prime', Courier, monospace; 
            font-size: 15px; 
            line-height: 1.45; 
        }

        /* ENCABEZADO CON NOMBRE Y NÚMERO DE PÁGINA */
        .page-number { 
            position: absolute; 
            top: 35px; 
            right: 45px; 
            font-size: 12px; 
            color: var(--text-muted); 
            font-family: 'Courier Prime', monospace; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* PIE DE PÁGINA CON COPYRIGHT DE PRODUCTORA */
        .page-footer {
            position: absolute;
            bottom: 35px;
            left: 45px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Courier Prime', monospace;
            letter-spacing: 0.5px;
        }

        /* PORTADA SPEC SCRIPT TRADICIONAL */
        .cover-page-spec { 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 840px; 
            font-family: 'Courier Prime', Courier, monospace; 
            position: relative;
        }

        .cover-center {
            margin-top: 240px;
            text-align: center;
        }

        .cover-title { 
            font-size: 18px; 
            font-weight: 700; 
            color: #fff; 
            text-transform: uppercase; 
            margin-bottom: 24px; 
            letter-spacing: 1px;
        }

        .cover-author { 
            font-size: 15px; 
            color: var(--text-main); 
            line-height: 1.6; 
        }

        .cover-footer-left {
            text-align: left;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: auto;
        }

        /* SINOPSIS Y REPARTO */
        .synopsis-page { font-family: 'Inter', sans-serif; }
        .synopsis-page h2 { font-size: 16px; font-weight: 700; color: #fff; margin-top: 20px; margin-bottom: 12px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; letter-spacing: 1px; }
        .synopsis-page p, .synopsis-page li { font-size: 14px; color: var(--text-main); margin-bottom: 10px; line-height: 1.6; }

        /* FORMATO GUIÓN DE CINE */
        .scene { 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-top: 24px; 
            margin-bottom: 10px; 
            color: #fff; 
            break-after: avoid; 
            page-break-after: avoid;
        }
        .action { 
            margin-bottom: 12px; 
            color: var(--text-main); 
            line-height: 1.45; 
            text-align: left;
        }
        .dialogue-group {
            margin-top: 14px;
            margin-bottom: 12px;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .character { 
            text-transform: uppercase; 
            font-weight: 700; 
            margin-bottom: 2px; 
            margin-left: 38%; 
            color: #fff; 
            text-align: left;
        }
        .parenthetical { 
            font-style: italic; 
            margin-left: 28%; 
            margin-right: 28%; 
            color: var(--text-muted); 
            margin-bottom: 2px; 
            text-align: left;
        }
        .dialogue { 
            margin-left: 22%; 
            margin-right: 22%; 
            color: var(--text-main); 
            text-align: left;
            line-height: 1.4;
        }

        @media print {
            body { background: white; color: black; }
            header { display: none !important; }
            .script-wrapper { margin: 0; padding: 0; gap: 0; max-width: 100%; }
            .page { 
                background: white !important; 
                color: black !important; 
                border: none !important; 
                box-shadow: none !important; 
                page-break-after: always; 
                break-after: page; 
                padding: 50px 60px; 
                min-height: auto; 
            }
            .cover-title, .synopsis-page h2, .scene, .character { color: black !important; }
            .cover-subtitle, .parenthetical, .page-number, .page-footer, .cover-footer-left { color: #555 !important; }
            .dialogue, .action, .cover-author, .synopsis-page p, .synopsis-page li { color: black !important; }
        }

        @media(max-width: 640px) {
            .page { padding: 40px 20px; }
            .character { margin-left: 25%; }
            .parenthetical { margin-left: 10%; margin-right: 10%; }
            .dialogue { margin-left: 5%; margin-right: 5%; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="guiones.html" class="btn-action">← Volver a la Lista</a>
            <span id="scriptTitleHeader" style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Cargando guion...</span>
        </div>
    </header>

    <div class="script-wrapper" id="scriptContainer">
        Cargando guion...
    </div>

    <script>
        async function loadScript() {
            const urlParams = new URLSearchParams(window.location.search);
            let filePath = urlParams.get('file') || 'scripts/el-silencio-de-un-corazon.txt';
            filePath = decodeURIComponent(filePath);

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error("No se pudo cargar el archivo");
                const text = await response.text();
                renderScreenplay(text);
            } catch (error) {
                document.getElementById('scriptContainer').innerHTML = "<p style='color: #ef4444; text-align: center; padding: 40px;'>Error al cargar el guion.</p>";
            }
        }

        function renderScreenplay(rawText) {
            const sections = rawText.split('---');
            let htmlOutput = '';
            let mainTitle = "Guion Erizofilm";

            // 1. PORTADA SPEC SCRIPT
            if (sections.length > 0) {
                const coverLines = sections[0].trim().split('\n');
                let title = "";
                let authorLines = [];
                let contactLines = [];

                coverLines.forEach(l => {
                    let trimmed = l.trim();
                    if (trimmed.startsWith('# ')) {
                        title = trimmed.replace('# ', '');
                    } else if (trimmed.toLowerCase().startsWith('contacto:') || trimmed.toLowerCase().startsWith('registro:')) {
                        contactLines.push(trimmed);
                    } else if (trimmed !== '' && !trimmed.toLowerCase().includes('guion para')) {
                        authorLines.push(trimmed);
                    }
                });
                if (title) mainTitle = title;

                htmlOutput += `
                    <div class="page">
                        <div class="cover-page-spec">
                            <div class="cover-center">
                                <div class="cover-title">${title}</div>
                                <div class="cover-author">${authorLines.join('<br>')}</div>
                            </div>
                            <div class="cover-footer-left">
                                ${contactLines.join('<br>')}
                            </div>
                        </div>
                    </div>
                `;
            }

            // 2. SINOPSIS Y REPARTO
            if (sections.length > 1) {
                const synopsisLines = sections[1].trim().split('\n');
                htmlOutput += `<div class="page"><div class="synopsis-page">`;
                synopsisLines.forEach(l => {
                    let trimmed = l.trim();
                    if (trimmed.startsWith('## ')) htmlOutput += `<h2>${trimmed.replace('## ', '')}</h2>`;
                    else if (trimmed.startsWith('- ')) htmlOutput += `<p style="margin-left:15px;">• ${trimmed.replace('- ', '')}</p>`;
                    else if (trimmed !== '') htmlOutput += `<p>${trimmed}</p>`;
                });
                htmlOutput += `</div></div>`;
            }

            // 3. GUIÓN CON NUMERACIÓN DE PÁGINA Y PIE CON COPYRIGHT
            if (sections.length > 2) {
                const fullScriptText = sections.slice(2).join('\n');
                const scriptLines = fullScriptText.trim().split('\n');

                let scriptBlocks = [];
                let sceneCount = 1;

                let currentCharacter = null;
                let currentParenthetical = null;
                let currentDialogueLines = [];

                function flushDialogueGroup() {
                    if (currentCharacter) {
                        let groupHtml = `<div class="dialogue-group">`;
                        groupHtml += `<div class="character">${currentCharacter}</div>`;
                        if (currentParenthetical) {
                            groupHtml += `<div class="parenthetical">${currentParenthetical}</div>`;
                        }
                        if (currentDialogueLines.length > 0) {
                            groupHtml += `<div class="dialogue">${currentDialogueLines.join('<br>')}</div>`;
                        }
                        groupHtml += `</div>`;
                        scriptBlocks.push(groupHtml);

                        currentCharacter = null;
                        currentParenthetical = null;
                        currentDialogueLines = [];
                    }
                }

                scriptLines.forEach(line => {
                    let trimmed = line.trim();
                    if (!trimmed) return;

                    trimmed = trimmed.replace(/^\d+\.\s*/, '');

                    if (trimmed.startsWith('INT.') || trimmed.startsWith('EXT.')) {
                        flushDialogueGroup();
                        scriptBlocks.push(`<div class="scene">${sceneCount}. ${trimmed}</div>`);
                        sceneCount++;
                    } else if (trimmed === trimmed.toUpperCase() && !trimmed.includes('.') && trimmed.length < 35 && !trimmed.startsWith('FADE')) {
                        flushDialogueGroup();
                        currentCharacter = trimmed;
                    } else if (trimmed.startsWith('(') && trimmed.endsWith(')')) {
                        if (currentCharacter) {
                            currentParenthetical = trimmed;
                        } else {
                            scriptBlocks.push(`<div class="parenthetical">${trimmed}</div>`);
                        }
                    } else if (trimmed.startsWith('FADE OUT') || trimmed.startsWith('FIN')) {
                        flushDialogueGroup();
                        scriptBlocks.push(`<div class="scene" style="text-align:right; margin-top:20px;">${trimmed}</div>`);
                    } else {
                        if (currentCharacter) {
                            currentDialogueLines.push(trimmed);
                        } else {
                            scriptBlocks.push(`<div class="action">${trimmed}</div>`);
                        }
                    }
                });

                flushDialogueGroup();

                const tempContainer = document.createElement('div');
                tempContainer.innerHTML = scriptBlocks.join('');
                tempContainer.style.visibility = 'hidden';
                tempContainer.style.position = 'absolute';
                tempContainer.style.width = '670px';
                tempContainer.style.fontFamily = "'Courier Prime', Courier, monospace";
                tempContainer.style.fontSize = '15px';
                tempContainer.style.lineHeight = '1.45';
                document.body.appendChild(tempContainer);

                const MAX_PAGE_HEIGHT = 780;
                let currentPageBlocks = [];
                let currentHeight = 0;
                let scriptPageNum = 1;

                const children = Array.from(tempContainer.children);

                for (let i = 0; i < children.length; i++) {
                    const child = children[i];
                    const childHeight = child.offsetHeight || 24;
                    const isSceneHeader = child.classList.contains('scene');

                    let extraHeightNeeded = childHeight;
                    if (isSceneHeader && i + 1 < children.length) {
                        extraHeightNeeded += (children[i + 1].offsetHeight || 24);
                    }

                    if (currentHeight + extraHeightNeeded > MAX_PAGE_HEIGHT && currentPageBlocks.length > 0) {
                        htmlOutput += `
                            <div class="page">
                                <div class="page-number">${mainTitle} — ${scriptPageNum}.</div>
                                <div class="script-body">${currentPageBlocks.map(el => el.outerHTML).join('')}</div>
                                <div class="page-footer">© 2026 Erizofilm</div>
                            </div>
                        `;
                        scriptPageNum++;
                        currentPageBlocks = [child];
                        currentHeight = childHeight;
                    } else {
                        currentPageBlocks.push(child);
                        currentHeight += childHeight;
                    }
                }

                if (currentPageBlocks.length > 0) {
                    htmlOutput += `
                        <div class="page">
                            <div class="page-number">${mainTitle} — ${scriptPageNum}.</div>
                            <div class="script-body">${currentPageBlocks.map(el => el.outerHTML).join('')}</div>
                            <div class="page-footer">© 2026 Erizofilm</div>
                        </div>
                    `;
                }

                document.body.removeChild(tempContainer);
            }

            document.getElementById('scriptContainer').innerHTML = htmlOutput;
            document.getElementById('scriptTitleHeader').textContent = "|  " + mainTitle;
            document.title = mainTitle + " — Erizofilm";
        }

        loadScript();
    </script>
</body>
</html>
