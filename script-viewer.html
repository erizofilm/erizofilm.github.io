<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Guion — Erizofilm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #0d0f12; 
            --card-bg: #121418; 
            --text-main: #e2e8f0; 
            --text-muted: #8a94a6; 
            --accent-primary: #6366f1; 
            --border-color: #22262f; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        header { 
            width: 100%; 
            background: rgba(18,20,24,0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border-color); 
            padding: 12px 24px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .btn-action { 
            background: #181b22; 
            color: var(--text-main); 
            border: 1px solid var(--border-color); 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 500; 
            cursor: pointer; 
            text-decoration: none; 
            transition: all 0.2s; 
        }
        .btn-action:hover { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

        .script-wrapper { 
            width: 100%; 
            max-width: 850px; 
            margin: 40px auto 80px auto; 
            display: flex; 
            flex-direction: column; 
            gap: 40px; 
            padding: 0 20px; 
        }

        /* HOJA TAMAÑO CARTA EN PANTALLA */
        .page { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            min-height: 980px; 
            padding: 80px 90px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            position: relative; 
            font-family: 'Courier Prime', Courier, monospace; 
            font-size: 15px; 
            line-height: 1.5; 
        }

        /* NUMERACIÓN (SÓLO VISIBLE A PARTIR DEL GUIÓN) */
        .page-number { 
            position: absolute; 
            top: 35px; 
            right: 45px; 
            font-size: 13px; 
            color: var(--text-muted); 
            font-family: 'Courier Prime', monospace; 
        }

        /* PORTADA */
        .cover-page { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 820px; 
            text-align: center; 
            font-family: 'Inter', sans-serif; 
        }
        .cover-title { font-size: 30px; font-weight: 700; color: #fff; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; font-family: 'Courier Prime', monospace; }
        .cover-subtitle { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 160px; }
        .cover-author { font-size: 14px; color: var(--text-main); line-height: 1.8; }

        /* SINOPSIS Y REPARTO */
        .synopsis-page { font-family: 'Inter', sans-serif; }
        .synopsis-page h2 { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; letter-spacing: 1px; }
        .synopsis-page p, .synopsis-page li { font-size: 14px; color: var(--text-main); margin-bottom: 12px; line-height: 1.6; }

        /* FORMATO GUIÓN */
        .scene { font-weight: 700; text-transform: uppercase; margin-top: 28px; margin-bottom: 14px; color: #fff; }
        .action { margin-bottom: 16px; color: var(--text-main); line-height: 1.5; }
        .character { text-transform: uppercase; font-weight: 700; margin-top: 20px; margin-bottom: 2px; margin-left: 38%; color: #fff; }
        .parenthetical { font-style: italic; margin-left: 28%; color: var(--text-muted); margin-bottom: 2px; }
        .dialogue { margin-left: 20%; margin-right: 20%; margin-bottom: 16px; color: var(--text-main); }

        @media print {
            body { background: white; color: black; }
            header { display: none !important; }
            .script-wrapper { margin: 0; padding: 0; gap: 0; }
            .page { 
                background: white !important; 
                color: black !important; 
                border: none !important; 
                box-shadow: none !important; 
                page-break-after: always; 
                break-after: page; 
                padding: 50px 60px; 
                min-height: auto; 
            }
            .cover-title, .synopsis-page h2, .scene, .character { color: black !important; }
            .cover-subtitle, .parenthetical, .page-number { color: #555 !important; }
            .dialogue, .action, .cover-author, .synopsis-page p, .synopsis-page li { color: black !important; }
        }

        @media(max-width: 640px) {
            .page { padding: 40px 20px; }
            .character { margin-left: 15%; }
            .parenthetical { margin-left: 8%; }
            .dialogue { margin-left: 0%; margin-right: 0%; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="guiones.html" class="btn-action">← Volver a la Lista</a>
            <span id="scriptTitleHeader" style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Cargando guion...</span>
        </div>
        <div>
            <button class="btn-action" onclick="window.print()">🖨️ PDF / Imprimir</button>
        </div>
    </header>

    <div class="script-wrapper" id="scriptContainer">
        Cargando guion...
    </div>

    <script>
        async function loadScript() {
            const urlParams = new URLSearchParams(window.location.search);
            let filePath = urlParams.get('file') || 'scripts/el-silencio-de-un-corazon.txt';
            filePath = decodeURIComponent(filePath);

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error("No se pudo cargar el archivo");
                const text = await response.text();
                renderScreenplay(text);
            } catch (error) {
                document.getElementById('scriptContainer').innerHTML = "<p style='color: #ef4444; text-align: center; padding: 40px;'>Error al cargar el guion.</p>";
            }
        }

        function renderScreenplay(rawText) {
            const sections = rawText.split('---');
            let htmlOutput = '';
            let mainTitle = "Guion Erizofilm";

            // 1. HOJA DE PORTADA (SIN NUMERACIÓN)
            if (sections.length > 0) {
                const coverLines = sections[0].trim().split('\n');
                let title = "";
                let subtitle = "";
                let authorInfo = [];

                coverLines.forEach(l => {
                    let trimmed = l.trim();
                    if (trimmed.startsWith('# ')) title = trimmed.replace('# ', '');
                    else if (trimmed !== '') {
                        if (!subtitle && !trimmed.toLowerCase().includes('escrito') && !trimmed.match(/^\d{4}$/)) subtitle = trimmed;
                        else authorInfo.push(trimmed);
                    }
                });
                if (title) mainTitle = title;

                htmlOutput += `
                    <div class="page">
                        <div class="cover-page">
                            <div class="cover-title">${title}</div>
                            <div class="cover-subtitle">${subtitle}</div>
                            <div class="cover-author">${authorInfo.join('<br>')}</div>
                        </div>
                    </div>
                `;
            }

            // 2. HOJA DE SINOPSIS Y REPARTO (SIN NUMERACIÓN)
            if (sections.length > 1) {
                const synopsisLines = sections[1].trim().split('\n');
                htmlOutput += `<div class="page"><div class="synopsis-page">`;
                synopsisLines.forEach(l => {
                    let trimmed = l.trim();
                    if (trimmed.startsWith('## ')) htmlOutput += `<h2>${trimmed.replace('## ', '')}</h2>`;
                    else if (trimmed.startsWith('- ')) htmlOutput += `<p style="margin-left:15px;">• ${trimmed.replace('- ', '')}</p>`;
                    else if (trimmed !== '') htmlOutput += `<p>${trimmed}</p>`;
                });
                htmlOutput += `</div></div>`;
            }

            // 3. DESARROLLO DEL GUIÓN (NUMERADO DESDE LA PÁGINA 1 EN ADELANTE)
            if (sections.length > 2) {
                const fullScriptText = sections.slice(2).join('\n');
                const scriptLines = fullScriptText.trim().split('\n');

                let scriptHtml = '';
                scriptLines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;

                    if (trimmed.startsWith('INT.') || trimmed.startsWith('EXT.') || trimmed.match(/^\d+\.\s+(INT|EXT)/)) {
                        scriptHtml += `<div class="scene">${trimmed}</div>`;
                    } else if (trimmed.startsWith('(') && trimmed.endsWith(')')) {
                        scriptHtml += `<div class="parenthetical">${trimmed}</div>`;
                    } else if (trimmed === trimmed.toUpperCase() && !trimmed.includes('.') && trimmed.length < 35 && !trimmed.startsWith('FADE')) {
                        scriptHtml += `<div class="character">${trimmed}</div>`;
                    } else if (trimmed.startsWith('FADE OUT') || trimmed.startsWith('FIN')) {
                        scriptHtml += `<div class="scene" style="text-align:right; margin-top:30px;">${trimmed}</div>`;
                    } else {
                        scriptHtml += `<div class="action">${trimmed}</div>`;
                    }
                });

                // Calculador dinámico de altura por página carta
                const tempContainer = document.createElement('div');
                tempContainer.innerHTML = scriptHtml;
                tempContainer.style.visibility = 'hidden';
                tempContainer.style.position = 'absolute';
                tempContainer.style.width = '670px';
                tempContainer.style.fontFamily = "'Courier Prime', Courier, monospace";
                tempContainer.style.fontSize = '15px';
                tempContainer.style.lineHeight = '1.5';
                document.body.appendChild(tempContainer);

                const MAX_PAGE_HEIGHT = 760;
                let currentPageHtml = '';
                let currentHeight = 0;
                let scriptPageNum = 1; // La numeración inicia en 1

                Array.from(tempContainer.children).forEach(child => {
                    const childHeight = child.offsetHeight || 24;

                    if (currentHeight + childHeight > MAX_PAGE_HEIGHT && currentPageHtml !== '') {
                        htmlOutput += `
                            <div class="page">
                                <div class="page-number">${scriptPageNum}.</div>
                                <div class="script-body">${currentPageHtml}</div>
                            </div>
                        `;
                        scriptPageNum++;
                        currentPageHtml = child.outerHTML;
                        currentHeight = childHeight;
                    } else {
                        currentPageHtml += child.outerHTML;
                        currentHeight += childHeight;
                    }
                });

                if (currentPageHtml !== '') {
                    htmlOutput += `
                        <div class="page">
                            <div class="page-number">${scriptPageNum}.</div>
                            <div class="script-body">${currentPageHtml}</div>
                        </div>
                    `;
                }

                document.body.removeChild(tempContainer);
            }

            document.getElementById('scriptContainer').innerHTML = htmlOutput;
            document.getElementById('scriptTitleHeader').textContent = "|  " + mainTitle;
            document.title = mainTitle + " — Erizofilm";
        }

        loadScript();
    </script>
</body>
</html>
