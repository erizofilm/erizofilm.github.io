<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Guion — Erizofilm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0d0f12; --card-bg: #121418; --text-main: #e2e8f0; --text-muted: #8a94a6; --accent-primary: #6366f1; --border-color: #22262f; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; background: rgba(18,20,24,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 12px 24px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .nav-actions { display: flex; gap: 10px; }
        .btn-action { background: #181b22; color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .btn-action:hover { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
        .container { width: 100%; max-width: 850px; margin-top: 36px; padding: 0 20px 80px 20px; }
        
        .script-paper { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 70px 90px; box-shadow: 0 20px 40px rgba(0,0,0,0.55); font-family: 'Courier Prime', Courier, monospace; font-size: 15px; line-height: 1.4; outline: none; }
        
        /* ESTILOS DE PORTADA Y SINOPSIS */
        .cover-page { text-align: center; padding: 80px 0; font-family: 'Inter', sans-serif; }
        .cover-title { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; font-family: 'Courier Prime', monospace; }
        .cover-subtitle { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 140px; }
        .cover-author { font-size: 14px; color: var(--text-main); line-height: 1.6; }
        
        .synopsis-page { padding: 20px 0; font-family: 'Inter', sans-serif; }
        .synopsis-page h2 { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; letter-spacing: 1px; }
        .synopsis-page p, .synopsis-page li { font-size: 14px; color: var(--text-main); margin-bottom: 14px; line-height: 1.6; }
        .synopsis-page ul { list-style: none; padding-left: 0; }
        
        .page-break { border: 0; border-top: 1px dashed var(--border-color); margin: 60px 0; }

        /* ESTILOS CLÁSICOS DE GUIÓN */
        .scene { font-weight: 700; text-transform: uppercase; margin-top: 36px; margin-bottom: 16px; color: #fff; }
        .action { margin-bottom: 18px; color: var(--text-main); }
        .character { text-transform: uppercase; font-weight: 700; margin-top: 22px; margin-bottom: 2px; margin-left: 38%; color: #fff; }
        .parenthetical { font-style: italic; margin-left: 28%; color: var(--text-muted); margin-bottom: 2px; }
        .dialogue { margin-left: 20%; margin-right: 20%; margin-bottom: 18px; color: var(--text-main); }
        
        @media(max-width: 640px) { .script-paper { padding: 35px 20px; } .character { margin-left: 20%; } .parenthetical { margin-left: 10%; } .dialogue { margin-left: 5%; margin-right: 5%; } }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="guiones.html" class="btn-action">← Volver a la Lista</a>
            <span id="scriptTitleHeader" style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Cargando guion...</span>
        </div>
        <div class="nav-actions">
            <button class="btn-action" onclick="window.print()">🖨️ PDF / Imprimir</button>
        </div>
    </header>

    <div class="container">
        <div class="script-paper" id="scriptContainer">
            Cargando contenido...
        </div>
    </div>

    <script>
        async function loadScript() {
            const urlParams = new URLSearchParams(window.location.search);
            let filePath = urlParams.get('file') || 'scripts/el-silencio.txt';
            filePath = decodeURIComponent(filePath);

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error("No se pudo cargar el archivo");
                const text = await response.text();
                parseScriptProperly(text);
            } catch (error) {
                document.getElementById('scriptContainer').innerHTML = "<p style='color: #ef4444; text-align: center; padding: 40px;'>Error: No se pudo cargar el archivo de guion especificado.</p>";
            }
        }

        function parseScriptProperly(rawText) {
            const parts = rawText.split('---');
            let htmlOutput = '';
            let mainTitle = "Guion Erizofilm";

            // PARTE 1: PORTADA
            if (parts.length > 0) {
                const coverLines = parts[0].trim().split('\n');
                let title = "";
                let subtitle = "";
                let authorInfo = [];

                coverLines.forEach(l => {
                    let trimmed = l.trim();
                    if (trimmed.startsWith('# ')) title = trimmed.replace('# ', '');
                    else if (trimmed !== '') {
                        if (!subtitle && !trimmed.toLowerCase().includes('escrito') && !trimmed.match(/^\d{4}$/)) subtitle = trimmed;
                        else authorInfo.push(trimmed);
                    }
                });
                if (title) mainTitle = title;

                htmlOutput += `
                    <div class="cover-page">
                        <div class="cover-title">${title}</div>
                        <div class="cover-subtitle">${subtitle}</div>
                        <div class="cover-author">${authorInfo.join('<br>')}</div>
                    </div>
                `;
            }

            // PARTE 2: SINOPSIS Y REPARTO
            if (parts.length > 1) {
                htmlOutput += `<hr class="page-break"><div class="synopsis-page">`;
                const synopsisLines = parts[1].trim().split('\n');
                
                synopsisLines.forEach(l => {
                    let trimmed = l.trim();
                    if (trimmed.startsWith('## ')) {
                        htmlOutput += `<h2>${trimmed.replace('## ', '')}</h2>`;
                    } else if (trimmed.startsWith('- ')) {
                        htmlOutput += `<li>${trimmed.replace('- ', '')}</li>`;
                    } else if (trimmed !== '') {
                        htmlOutput += `<p>${trimmed}</p>`;
                    }
                });
                htmlOutput += `</div>`;
            }

            // PARTE 3: EL GUIÓN TÉCNICO (Escenas, diálogos, etc.)
            if (parts.length > 2) {
                htmlOutput += `<hr class="page-break"><div class="script-body">`;
                const scriptLines = parts[2].trim().split('\n');

                scriptLines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;

                    if (trimmed.startsWith('INT.') || trimmed.startsWith('EXT.')) {
                        htmlOutput += `<div class="scene">${trimmed}</div>`;
                    } else if (trimmed.startsWith('(') && trimmed.endsWith(')')) {
                        htmlOutput += `<div class="parenthetical">${trimmed}</div>`;
                    } else if (trimmed.startsWith('- ')) {
                        htmlOutput += `<div class="action">${trimmed.replace('- ', '')}</div>`;
                    } else if (trimmed === trimmed.toUpperCase() && !trimmed.includes('.') && trimmed.length < 30) {
                        htmlOutput += `<div class="character">${trimmed}</div>`;
                    } else {
                        htmlOutput += `<div class="dialogue">${trimmed}</div>`;
                    }
                });
                htmlOutput += `</div>`;
            }

            document.getElementById('scriptContainer').innerHTML = htmlOutput;
            document.getElementById('scriptTitleHeader').textContent = "|  " + mainTitle;
            document.title = mainTitle + " — Erizofilm";
        }

        loadScript();
    </script>
</body>
</html>
