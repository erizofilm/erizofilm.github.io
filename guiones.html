<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Guiones — Erizofilm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0d0f12; --card-bg: #121418; --text-main: #e2e8f0; --text-muted: #8a94a6; --accent-primary: #6366f1; --border-color: #22262f; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 700px; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .header-nav a { color: var(--text-muted); text-decoration: none; font-size: 13px; }
        .header-nav a:hover { color: #fff; }
        h1 { font-size: 22px; font-weight: 600; color: #fff; }
        .script-list { display: flex; flex-direction: column; gap: 12px; }
        .script-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; text-decoration: none; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .script-card:hover { border-color: var(--accent-primary); transform: translateY(-2px); }
        .script-title { font-weight: 600; font-size: 15px; color: #fff; margin-bottom: 4px; text-transform: capitalize; }
        .script-desc { font-size: 13px; color: var(--text-muted); }
        .script-badge { background: rgba(99,102,241,0.15); color: var(--accent-primary); font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-nav">
            <h1>Lista de Proyectos</h1>
            <a href="index.html">← Volver a la Portada</a>
        </div>
        
        <div class="script-list" id="scriptList">
            <div style="color: var(--text-muted); text-align: center; padding: 20px;">Cargando guiones automáticamente...</div>
        </div>
    </div>

    <script>
        // ESTE SCRIPT LEE TU CARPETA "scripts" AUTOMÁTICAMENTE
        async function loadAutomaticList() {
            try {
                // Reemplaza "erizofilm" y "erizofilm.github.io" con los datos exactos de tu usuario y repositorio de GitHub
                const repoUser = "erizofilm";
                const repoName = "erizofilm.github.io";
                
                const response = await fetch(`https://api.github.com/repos/${repoUser}/${repoName}/contents/scripts`);
                const files = await response.json();
                
                const listContainer = document.getElementById('scriptList');
                listContainer.innerHTML = '';

                let found = false;
                files.forEach(file => {
                    if (file.name.endsWith('.txt')) {
                        found = true;
                        // Limpia el nombre del archivo para mostrarlo bonito (ej: "el-silencio.txt" -> "El Silencio")
                        const cleanName = file.name.replace('.txt', '').replace(/-/g, ' ');
                        
                        listContainer.innerHTML += `
                            <a href="script-viewer.html?file=scripts/${file.name}" class="script-card">
                                <div>
                                    <div class="script-title">🎬 ${cleanName}</div>
                                    <div class="script-desc">Guion cinematográfico — Formato Scrybe</div>
                                </div>
                                <span class="script-badge">Leer Guion</span>
                            </a>
                        `;
                    }
                });

                if (!found) {
                    listContainer.innerHTML = '<div style="color: var(--text-muted); text-align: center;">No hay guiones en la carpeta scripts todavía.</div>';
                }
            } catch (e) {
                document.getElementById('scriptList').innerHTML = '<div style="color: #ef4444; text-align: center;">Error al cargar la lista automáticamente.</div>';
            }
        }

        loadAutomaticList();
    </script>
</body>
</html>
