<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erizofilm — Guiones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-carbon: #020203;       
            --card-carbon: #07090c;     
            --border-carbon: #181d24;   
            --text-cream: #e2e8f0;
            --text-muted: #475569;
            --solid-color: #700c24;     
            --solid-hover: #500819;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100vh; width: 100%; }

        body {
            background-color: var(--bg-carbon);
            color: var(--text-cream);
            font-family: 'Special Elite', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            background-image: radial-gradient(rgba(112, 12, 36, 0.04) 1px, transparent 0);
            background-size: 20px 20px;
        }

        .catalog-header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--border-carbon);
            padding-bottom: 25px;
            margin-bottom: 40px;
        }

        .catalog-title {
            font-family: 'Caveat', cursive;
            font-size: 42px;
            color: #f1f5f9;
            letter-spacing: 2px;
        }

        .btn-back {
            display: inline-block;
            background-color: transparent;
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 16px;
            font-family: 'Special Elite', monospace;
            font-size: 12px;
            letter-spacing: 1.5px;
            border: 1px solid var(--border-carbon);
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            color: #f1f5f9;
            border-color: #475569;
            background-color: rgba(255,255,255,0.02);
        }

        .scripts-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }

        .script-card {
            background-color: var(--card-carbon);
            border: 2px solid var(--border-carbon);
            border-radius: 8px;
            padding: 25px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .script-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background-color: var(--solid-color);
        }

        .script-card:hover {
            border-color: #2a3442;
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.95);
        }

        .script-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .script-meta {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .script-name {
            font-family: 'Caveat', cursive;
            font-size: 32px;
            color: #f1f5f9;
            letter-spacing: 1px;
            line-height: 1;
        }

        .script-logline {
            font-size: 13px;
            color: #94a3b8;
            font-family: 'Special Elite', monospace;
            max-width: 480px;
            margin-top: 4px;
        }

        .btn-read {
            background-color: var(--solid-color);
            color: #f1f5f9;
            text-decoration: none;
            padding: 12px 24px;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 1.5px;
            border-radius: 4px;
            border: 1px solid rgba(159, 18, 57, 0.4);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-read:hover {
            background-color: var(--solid-hover);
            border-color: rgba(159, 18, 57, 0.8);
            transform: scale(1.03);
        }

        .footer-vintage {
            margin-top: auto;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .catalog-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .script-card { flex-direction: column; align-items: flex-start; gap: 20px; }
            .btn-read { width: 100%; text-align: center; }
            .script-name { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="catalog-header">
        <div>
            <div class="script-meta">Erizofilm Studios — Archivo</div>
            <h1 class="catalog-title">Guiones</h1>
        </div>
        <a href="index.html" class="btn-back">← Volver al Inicio</a>
    </div>

    <!-- Contenedor dinámico -->
    <div class="scripts-container" id="scriptsList">
        <div style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 20px;">
            Buscando archivos en el archivo...
        </div>
    </div>

    <div class="footer-vintage">
        © 2026 ERIZOFILM STUDIOS · ARCHIVO CONFIDENCIAL DE ESCRITURA
    </div>

    <script>
        // Registro apuntando a la carpeta /script/
        const guionesDisponibles = [
            {
                titulo: "El Silencio de un Corazón",
                tipo: "Cortometraje · Thriller / Drama",
                logline: "Dinámicas de tensión y conflictos románticos entre das amigas, un admirador y un misterioso motociclista.",
                archivo: "script/el-silencio-de-un-corazon.pdf" // Apunta a la carpeta script/
            }
        ];

        const container = document.getElementById('scriptsList');

        if (guionesDisponibles.length === 0) {
            container.innerHTML = `<div style="color: var(--text-muted); text-align: center;">No hay guiones registrados en este momento.</div>`;
        } else {
            container.innerHTML = '';
            guionesDisponibles.forEach(script => {
                const card = document.createElement('div');
                card.className = 'script-card';
                card.innerHTML = `
                    <div class="script-info">
                        <span class="script-meta">${script.tipo}</span>
                        <h2 class="script-name">${script.titulo}</h2>
                        <p class="script-logline">${script.logline}</p>
                    </div>
                    <a href="${script.archivo}" target="_blank" class="btn-read">📄 Leer Guion</a>
                `;
                container.appendChild(card);
            });
        }
    </script>

</body>
</html>
